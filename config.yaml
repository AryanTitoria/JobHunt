# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    # Core software engineering
    - '\bsoftware engineer\b'
    - '\bsoftware development engineer\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'

    # Backend / full-stack
    - '\bbackend engineer\b'
    - '\bback-end engineer\b'
    - '\b(full[\s-]?stack)\s+(software\s+)?engineer\b'
    - '\bweb engineer\b'
    - '\bbackend developer\b'
    - '\bback-end developer\b'
    - '\bfull[\s-]?stack developer\b'
    - '\bsoftware developer\b'

    # General engineering roles
    - '\bplatform engineer\b'
    - '\bsystems engineer\b'
    - '\bdistributed systems engineer\b'
    - '\bcloud engineer\b'
    - '\binfrastructure engineer\b'
    - '\bsite reliability engineer\b'
    - '\bsre\b'
    - '\bmember of technical staff\b'

    # Language-specific roles relevant to your resume
    - '\bc\+\+\b.*\bengineer\b'
    - '\bengineer\b.*\bc\+\+\b'
    - '\bpython\b.*\bengineer\b'
    - '\bengineer\b.*\bpython\b'
    - '\bjava\b.*\bengineer\b'
    - '\bengineer\b.*\bjava\b'

    # Data / AI roles relevant to your projects
    - '\bdata engineer\b'
    - '\bmachine learning engineer\b'
    - '\bml engineer\b'
    - '\bai engineer\b'
    - '\bartificial intelligence engineer\b'

    # Networking / performance — keep because of your C++ project,
    # but don't include kernel/embedded-specific roles.
    - '\bnetwork(ing)?\s+(software\s+)?engineer\b'
    - '\bperformance engineer\b'


  exclude_titles:
    # Too senior
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(lead|tech lead|team lead)\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'

    # Non-engineering
    - '\b(sales|account executive|marketing|recruit|recruiter|support|customer success|success)\b'

    # Wrong engineering disciplines
    - '\b(ios|android|mobile|game|designer)\b'

    # Roles that don't match your current profile
    - '\b(data scientist|machine learning scientist|research scientist)\b'    

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - india
    - pan india
    - bengaluru
    - bangalore
    - hyderabad
    - pune
    - gurugram
    - gurgaon
    - noida
    - greater noida
    - mumbai
    - navi mumbai
    - chennai
    - delhi
    - new delhi
    - ahmedabad
    - jaipur
    - chandigarh
    - indore

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 6.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
